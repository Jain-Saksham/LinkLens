# Render Blueprint: backend (Docker), Redis-compatible cache, and the static frontend.
# PostgreSQL is NOT here on purpose: Render's free Postgres is deleted 30 days after creation, so the
# database is a Neon free project (permanent free plan) whose credentials are entered as secrets.
#
# Every service deploys only after GitHub checks (the CI workflow) pass on the pushed commit.
# Service names become subdomains (<name>.onrender.com). If a name is taken Render adds a suffix;
# then update APP_BASE_URL / CORS_ALLOWED_ORIGINS / VITE_* below to the real URLs.

services:
  # --- API, redirects and preview pages: the public short-link domain ---
  - type: web
    name: linklens
    runtime: docker
    plan: free                      # 512 MB RAM, 0.1 CPU, sleeps after 15 min without traffic
    region: singapore               # same region as the Neon project (aws-ap-southeast-1)
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health/liveness   # never touches the DB, so it can't keep Neon awake
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      # Secrets: entered once in the Render dashboard when the Blueprint is created, never committed.
      - key: DB_URL                 # jdbc:postgresql://<neon-host>/<db>?sslmode=require  (direct, not -pooler)
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linklens-cache
          property: connectionString
      - key: APP_BASE_URL
        value: https://linklens.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://linklens-app.onrender.com
      # Render terminates TLS and forwards via its proxy; trust X-Forwarded-* from it (RemoteIpValve
      # takes the right-most untrusted address, so a client can't spoof its rate-limit key).
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      # Neon free = 100 compute-hours/month; let it scale to zero between requests.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MIN_IDLE
        value: "0"
      - key: DB_IDLE_TIMEOUT_MS
        value: "60000"
      - key: DB_MAX_LIFETIME_MS
        value: "240000"
      # Background destination checks: every 30 min instead of 30 s, for the same reason.
      - key: HEALTH_POLL_INTERVAL
        value: 30m
      - key: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: ecs

  # --- Cache: a pure, fail-open cache, so the free tier's lack of persistence is fine ---
  - type: keyvalue
    name: linklens-cache
    plan: free
    region: singapore
    ipAllowList: []                 # internal network only: no public access
    maxmemoryPolicy: allkeys-lru    # evict least-recently-used keys when full (it's a cache)

  # --- Frontend: static files on Render's CDN (static sites don't sleep) ---
  - type: web
    name: linklens-app
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://linklens.onrender.com
      - key: VITE_SHORT_BASE_URL
        value: https://linklens.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
