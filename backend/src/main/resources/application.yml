# Every deploy-specific value comes from an environment variable (or backend/.env locally).
# Defaults below are for local development only.
spring:
  application:
    name: linklens
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linklens}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Fail fast when the database is unreachable (default is 30s per request).
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}   # milliseconds (Hikari takes a plain long)
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Serverless Postgres (Neon) suspends when idle and bills compute while awake. Letting the pool
      # drain to zero idle connections lets it suspend; max-lifetime recycles connections well before
      # the server would drop them. Locally these defaults behave like a normal pool.
      minimum-idle: ${DB_MIN_IDLE:10}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      data-source-properties:
        # Turns JDBC batches into multi-row INSERTs (used by the click flusher).
        reWriteBatchedInserts: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      # Redis is an optimisation: a slow or dead Redis must cost milliseconds, not seconds.
      timeout: ${REDIS_TIMEOUT:250ms}
      connect-timeout: ${REDIS_TIMEOUT:250ms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the mapping matches.
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 15s
  task:
    scheduling:
      pool:
        # Default is ONE thread shared by every @Scheduled job: a slow health-check poll would then
        # delay the click flusher. Separate threads keep the jobs independent.
        size: 3

server:
  # PaaS hosts (Render, Heroku-style) inject PORT; SERVER_PORT still wins when set explicitly.
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful
  # Behind a reverse proxy, set to "native" or "framework" so the real client IP (used for rate
  # limiting) comes from X-Forwarded-For. Left off by default: trusting that header without a proxy
  # would let any client pick its own rate-limit key.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  short-code-length: ${SHORT_CODE_LENGTH:7}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cache:
    enabled: ${CACHE_ENABLED:true}
    ttl: ${CACHE_TTL:1h}
    negative-ttl: ${CACHE_NEGATIVE_TTL:60s}
    failure-backoff: ${CACHE_FAILURE_BACKOFF:30s}
  health:
    enabled: ${HEALTH_CHECKS_ENABLED:true}
    poll-interval: ${HEALTH_POLL_INTERVAL:30s}
    healthy-interval: ${HEALTH_CHECK_INTERVAL:24h}
    failure-threshold: ${HEALTH_FAILURE_THRESHOLD:2}
  live:
    max-subscribers-per-link: ${LIVE_MAX_PER_LINK:50}
    max-subscribers: ${LIVE_MAX_TOTAL:1000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:20}
    refill-period: ${RATE_LIMIT_REFILL_PERIOD:1m}
    # Production behind Cloudflare (Render): CF-Connecting-IP. Empty = connection remote address.
    client-ip-header: ${CLIENT_IP_HEADER:}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health}
  endpoint:
    health:
      # /actuator/health/liveness  = "the process is up" (no dependencies): what the platform polls,
      #                              so frequent health checks never wake or bill the database.
      # /actuator/health/readiness = "can serve traffic" (includes the database).
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    # Redis is an optional cache (the app fails open without it), so it must not mark the app DOWN.
    redis:
      enabled: false

# JSON logs in production: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (Spring Boot structured logging).
